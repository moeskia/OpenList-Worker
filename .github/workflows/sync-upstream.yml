name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream and preserve custom Wrangler configuration
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/OpenListTeam/OpenList-Worker.git
          git fetch upstream main
          cp wrangler.jsonc "$RUNNER_TEMP/wrangler.jsonc"
          git merge --no-edit -X ours upstream/main
          cp "$RUNNER_TEMP/wrangler.jsonc" wrangler.jsonc
          if ! git diff --quiet -- wrangler.jsonc; then
            git add wrangler.jsonc
            git commit -m "Preserve custom Wrangler configuration"
          fi
          git push origin HEAD:main
