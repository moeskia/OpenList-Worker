name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Backup custom Wrangler configuration
        run: |
          test -f wrangler.jsonc
          cp wrangler.jsonc "$RUNNER_TEMP/wrangler.jsonc"

      - name: Sync upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync moeskia/OpenList-Worker --source OpenListTeam/OpenList-Worker --branch main

      - name: Restore custom Wrangler configuration
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/wrangler.jsonc" wrangler.jsonc
          if ! git diff --quiet -- wrangler.jsonc; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.jsonc
            git commit -m "Preserve custom Wrangler configuration"
            git push origin HEAD:main
          fi
